name: ole-fix-release

on:
  push:
    branches:
      - ole-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ole-fix

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure Git for submodules
        run: |
          git config --global net.git-fetch-with-cli true
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.postBuffer 1048576000

      - name: Build responses-api-proxy
        run: |
          cd codex-rs && cargo build --release --target x86_64-unknown-linux-gnu -p codex-responses-api-proxy
        env:
          CARGO_NET_RETRY: 10
          CARGO_NET_FETCH_WITH_CLI: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex-responses-api-proxy release/
          cd release
          tar czf codex-responses-api-proxy-linux-amd64.tar.gz codex-responses-api-proxy
          sha256sum codex-responses-api-proxy-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: release/*
          retention-days: 7

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ole-fix

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure Git for submodules
        run: |
          git config --global net.git-fetch-with-cli true
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.postBuffer 1048576000

      - name: Build responses-api-proxy
        run: |
          cd codex-rs && cargo build --release --target aarch64-apple-darwin -p codex-responses-api-proxy
        env:
          CARGO_NET_RETRY: 10
          CARGO_NET_FETCH_WITH_CLI: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp codex-rs/target/aarch64-apple-darwin/release/codex-responses-api-proxy release/
          cd release
          tar czf codex-responses-api-proxy-mac-arm64.tar.gz codex-responses-api-proxy
          sha256sum codex-responses-api-proxy-mac-arm64.tar.gz > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release/*
          retention-days: 7

  release:
    needs: [build-linux-amd64, build-mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ole-fix

      - name: Download linux-amd64
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: release/linux-amd64

      - name: Download mac-arm64
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release/mac-arm64

      - name: Prepare combined SHA256SUMS
        run: |
          cat release/linux-amd64/SHA256SUMS release/mac-arm64/SHA256SUMS > release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ole-fix-${{ github.run_number }}
          name: ole-fix build ${{ github.run_number }}
          body: |
            ole-fix release build

            ## Changes
            - Chat Completions API compatibility
            - 429 Retry-After backoff fix

            ## Assets
            - codex-responses-api-proxy-linux-amd64.tar.gz
            - codex-responses-api-proxy-mac-arm64.tar.gz
          files: |
            release/linux-amd64/codex-responses-api-proxy-linux-amd64.tar.gz
            release/mac-arm64/codex-responses-api-proxy-mac-arm64.tar.gz
            release/SHA256SUMS
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
