# Build Linux AMD64 binary for deployment to local machines.
# Uses ubuntu-22.04 runner (glibc 2.35) for maximum compatibility:
# - Debian 12 (glibc 2.36) ✓
# - Ubuntu 22.04+ (glibc 2.35+) ✓
# - Ubuntu 24.04 (glibc 2.39) ✓
#
# Trigger manually via: gh workflow run build-linux-amd64.yml
# Download: gh run download <run-id> --name codex-linux-amd64

name: Build Linux AMD64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'
        type: string
  push:
    tags:
      - "rust-v*.*.*"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build Linux AMD64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Build codex binary
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 4
        run: |
          cargo build --release --bin codex
          strip target/release/codex

      - name: Verify binary
        run: |
          file target/release/codex
          ldd target/release/codex
          target/release/codex --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-amd64
          path: codex-rs/target/release/codex
          retention-days: 30
          if-no-files-found: error

      - name: Create tarball
        run: |
          cd target/release
          tar -czvf codex-linux-amd64.tar.gz codex

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-amd64-tarball
          path: codex-rs/target/release/codex-linux-amd64.tar.gz
          retention-days: 30
          if-no-files-found: error
