# Build Linux AMD64 binary for deployment to local machines.
# This workflow builds a static/musl-linked binary that works across
# different Linux distributions (Ubuntu, Debian, etc.) without glibc
# version compatibility issues.
#
# Trigger manually via: gh workflow run build-linux-amd64.yml
# Or via GitHub UI: Actions -> Build Linux AMD64 -> Run workflow
#
# Download artifacts:
#   gh run download <run-id> --name codex-linux-amd64
#   # or from GitHub UI: Actions -> <run> -> Artifacts

name: Build Linux AMD64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'
        type: string
  push:
    tags:
      - "rust-v*.*.*"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build Linux AMD64 (static)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Build codex binary (static/musl)
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 4
        run: |
          cargo build --release --bin codex --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/codex

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/codex
          ldd target/x86_64-unknown-linux-musl/release/codex || echo "Static binary (no dynamic deps)"
          target/x86_64-unknown-linux-musl/release/codex --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-amd64
          path: codex-rs/target/x86_64-unknown-linux-musl/release/codex
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact (tar.gz for easy deployment)
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar -czvf codex-linux-amd64.tar.gz codex
        working-directory: codex-rs

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-amd64-tarball
          path: codex-rs/target/x86_64-unknown-linux-musl/release/codex-linux-amd64.tar.gz
          retention-days: 30
          if-no-files-found: error
