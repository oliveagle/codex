name: ole-fix-build

on:
  push:
    branches:
      - ole-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Git
        run: |
          git config --global net.git-fetch-with-cli true
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.postBuffer 1048576000

      - name: Build codex
        run: |
          cd codex-rs && cargo build --release --target x86_64-unknown-linux-gnu -p codex-cli --bin codex
        env:
          CODEX_SKIP_BWRAP_BUILD: "1"
          CARGO_NET_RETRY: 10
          CARGO_NET_FETCH_WITH_CLI: true

      - name: Prepare linux-amd64 asset
        run: |
          mkdir -p release
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex release/
          cd release
          tar czf codex-linux-amd64.tar.gz codex
          sha256sum codex-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload linux-amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: release/*
          retention-days: 7

  build-mac-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Git
        # Do NOT redirect chromium.googlesource.com to the dead cortex/libyuv mirror.
        # Let cargo use the original URL with the system git CLI.
        run: |
          git config --global net.git-fetch-with-cli true
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.postBuffer 1048576000

      - name: Build codex
        run: |
          cd codex-rs && cargo build --release --target aarch64-apple-darwin -p codex-cli --bin codex
        env:
          CODEX_SKIP_BWRAP_BUILD: "1"
          CARGO_NET_RETRY: 10
          CARGO_NET_FETCH_WITH_CLI: true

      - name: Prepare mac-arm64 asset
        run: |
          mkdir -p release
          cp codex-rs/target/aarch64-apple-darwin/release/codex release/
          cd release
          tar czf codex-mac-arm64.tar.gz codex
          sha256sum codex-mac-arm64.tar.gz > SHA256SUMS

      - name: Upload mac-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release/*
          retention-days: 7

  release:
    needs: [build-linux-amd64, build-mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-amd64
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: release/linux-amd64

      - name: Download mac-arm64
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release/mac-arm64

      - name: Prepare combined SHA256SUMS
        run: |
          cat release/linux-amd64/SHA256SUMS release/mac-arm64/SHA256SUMS > release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ole-fix-${{ github.run_number }}
          name: ole-fix build ${{ github.run_number }}
          body: |
            ole-fix release build

            ## Assets
            - codex-linux-amd64.tar.gz
            - codex-mac-arm64.tar.gz
          files: |
            release/linux-amd64/codex-linux-amd64.tar.gz
            release/mac-arm64/codex-mac-arm64.tar.gz
            release/SHA256SUMS
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
